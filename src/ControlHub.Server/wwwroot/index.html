<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ClassIsland 集控系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b9dff'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%230f1115'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%230f1115'/%3E%3Crect x='7' y='21' width='15' height='3' rx='1.5' fill='%230f1115'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css?v=6" />
</head>

<body>
  <!-- 应用外壳 -->
  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark">CI</div>
        <div class="brand-text">
          <strong id="brandTitle">集控中心</strong>
          <span id="brandServerName">ClassIsland 集控</span>
        </div>
      </div>

      <nav class="nav" id="navList"></nav>

      <div class="sidebar-footer">
        <div class="conn-state" id="connState">
          <span class="dot"></span><span class="conn-text">连接中…</span>
        </div>
        <div class="sidebar-version" id="sidebarVersion">—</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon btn-ghost" id="collapseBtn" title="折叠 / 展开侧边栏" aria-label="折叠侧边栏">☰</button>
          <div class="topbar-titles">
            <h1 id="pageTitle">仪表盘</h1>
            <p id="pageSubtitle" class="page-subtitle"></p>
          </div>
        </div>
        <div class="topbar-right">
          <span class="revision-chip" id="revisionChip" title="当前全局配置版本号">版本 —</span>
          <div class="user-menu">
            <button class="btn btn-icon btn-ghost" id="themeBtn" title="切换主题" aria-label="切换主题">☾</button>
            <div class="dropdown theme-menu" id="themeDropdown" hidden></div>
          </div>
          <button class="btn btn-ghost" id="refreshBtn" title="刷新当前页面">刷新</button>
          <div class="user-menu">
            <button class="btn btn-ghost" id="userBtn">
              <span class="avatar" id="userAvatar">A</span>
              <span id="userName">管理员</span>
            </button>
            <div class="dropdown" id="userDropdown" hidden>
              <button data-action="change-password">修改密码</button>
              <button data-action="logout">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- 登录页 -->
  <div id="loginView" class="login-page">
    <div class="login-card">
      <div class="login-head">
        <div class="brand-mark large" id="loginBrandMark">CI</div>
        <h1 id="loginTitle">ClassIsland 集控系统</h1>
        <p id="loginServerName">正在连接服务器…</p>
      </div>
      <form id="loginForm" class="login-form">
        <label class="field">
          <span>用户名</span>
          <input type="text" id="loginUsername" autocomplete="username" placeholder="admin" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="请输入密码" required />
        </label>
        <div class="login-error" id="loginError" hidden></div>
        <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">登录</button>
      </form>
      <div class="login-foot">
        <span>首次部署默认账号为 <code>admin</code>，密码见服务端配置文件，登录后请立即修改。</span>
      </div>
    </div>
  </div>

  <!-- 全局提示与弹窗容器 -->
  <div id="toastHost" class="toast-host"></div>
  <div id="modalHost" class="modal-host" hidden></div>

  <script type="module" src="js/app.js?v=6"></script>
</body>

</html>
