<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ClassislandControlHub 集控系统</title>
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="css/app.css?v=22" />
</head>

<body>
  <!-- 应用外壳 -->
  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark">CI</div>
        <div class="brand-text">
          <strong id="brandTitle">集控中心</strong>
          <span id="brandServerName">ClassislandControlHub 集控</span>
        </div>
      </div>

      <nav class="nav" id="navList"></nav>

      <div class="sidebar-footer">
        <div class="conn-state" id="connState">
          <span class="dot"></span><span class="conn-text">连接中…</span>
        </div>
        <div class="sidebar-version" id="sidebarVersion">—</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon btn-ghost" id="collapseBtn" title="折叠 / 展开侧边栏" aria-label="折叠侧边栏">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 7h17M3.5 12h17M3.5 17h17" /></svg>
          </button>
          <div class="topbar-titles">
            <h1 id="pageTitle">仪表盘</h1>
            <p id="pageSubtitle" class="page-subtitle"></p>
          </div>
        </div>
        <div class="topbar-right">
          <span class="revision-chip" id="revisionChip" title="当前全局配置版本号">版本 —</span>
          <div class="user-menu">
            <button class="btn btn-icon btn-ghost" id="themeBtn" title="切换主题" aria-label="切换主题"></button>
            <div class="dropdown theme-menu" id="themeDropdown" hidden></div>
          </div>
          <button class="btn btn-ghost" id="refreshBtn" title="刷新当前页面">刷新</button>
          <div class="user-menu">
            <button class="btn btn-ghost" id="userBtn">
              <span class="avatar" id="userAvatar">A</span>
              <span id="userName">管理员</span>
            </button>
            <div class="dropdown" id="userDropdown" hidden>
              <button data-action="change-password">修改密码</button>
              <button data-action="logout">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- 登录页 -->
  <div id="loginView" class="login-page">
    <div class="login-card">
      <div class="login-head">
        <div class="brand-mark large" id="loginBrandMark">CI</div>
        <h1 id="loginTitle">ClassislandControlHub</h1>
        <p id="loginServerName" class="login-server">
          <span class="login-server-dot"></span><span id="loginServerText">正在连接服务器…</span>
        </p>
      </div>
      <form id="loginForm" class="login-form" autocomplete="on">
        <label class="field">
          <span>用户名</span>
          <input type="text" id="loginUsername" autocomplete="username" placeholder="请输入用户名" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="请输入密码" required />
        </label>
        <div class="login-error" id="loginError" hidden></div>
        <button class="btn btn-primary btn-block login-submit" type="submit" id="loginSubmit">登录</button>
      </form>

      <!-- 凭邀请码自助注册（由服务端开关决定是否展示入口） -->
      <form id="registerForm" class="login-form" autocomplete="on" hidden>
        <label class="field">
          <span>邀请码</span>
          <input type="text" id="registerCode" placeholder="由管理员发放" required />
        </label>
        <label class="field">
          <span>用户名</span>
          <input type="text" id="registerUsername" autocomplete="username" placeholder="3~32 位，字母 / 数字 / . _ -" required />
        </label>
        <label class="field">
          <span>显示名称</span>
          <input type="text" id="registerDisplayName" placeholder="留空则使用用户名" />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="registerPassword" autocomplete="new-password" placeholder="至少 8 位，需同时包含字母与数字" required />
        </label>
        <div class="login-error" id="registerError" hidden></div>
        <button class="btn btn-primary btn-block login-submit" type="submit" id="registerSubmit">注册并登录</button>
      </form>

      <div class="login-switch">
        <button type="button" class="linkish" id="switchToRegister" hidden>使用邀请码注册</button>
        <button type="button" class="linkish" id="switchToLogin" hidden>已有账号？返回登录</button>
      </div>

      <div class="login-foot">
        <span id="loginFootHint">首次部署默认账号 <code>admin</code>，登录后请立即修改密码。</span>
      </div>
    </div>
  </div>

  <!-- 全局提示与弹窗容器 -->
  <div id="toastHost" class="toast-host"></div>
  <div id="modalHost" class="modal-host" hidden></div>

  <!-- 新手引导浮层 -->
  <div id="tourHost" class="tour-host" hidden></div>

  <script type="module" src="js/app.js?v=22"></script>
</body>

</html>
