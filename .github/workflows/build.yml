name: 构建

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ── A 端 / 协议 / 桌面端：Linux 与 Windows 都必须能编译 ──
  server:
    name: 构建 A 端（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原
        run: |
          dotnet restore src/ControlHub.Server/ControlHub.Server.csproj
          dotnet restore src/ControlHub.Desktop/ControlHub.Desktop.csproj
          dotnet restore src/ControlHub.LoadTest/ControlHub.LoadTest.csproj
          dotnet restore src/ControlHub.Shell/ControlHub.Shell.csproj
          dotnet restore tests/ControlHub.Tests/ControlHub.Tests.csproj

      - name: 构建（Release）
        run: |
          dotnet build src/ControlHub.Server/ControlHub.Server.csproj -c Release --no-restore
          dotnet build src/ControlHub.Desktop/ControlHub.Desktop.csproj -c Release --no-restore
          dotnet build src/ControlHub.LoadTest/ControlHub.LoadTest.csproj -c Release --no-restore

      - name: 单元测试
        run: dotnet test tests/ControlHub.Tests/ControlHub.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      # 冒烟：真的把服务端起起来打一次接口。编译通过但运行起不来（缺依赖、端口/配置问题）这类失败
      # 只有跑到这一步才会暴露，所以在 CI 里固定跑一遍。
      - name: 冒烟（启动服务端并探活）
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          dotnet run --project src/ControlHub.Server/ControlHub.Server.csproj -c Release --no-build -- \
            --ControlHub:HttpPort=29800 --ControlHub:DataDirectory="$RUNNER_TEMP/ch-data" \
            --ControlHub:AutoCheckUpdates=false --ControlHub:EnableDiscovery=false &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:29800/api/health/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::服务端未在 30 秒内就绪"
            exit 1
          fi
          echo "── 就绪探针 ──"
          curl -fsS http://127.0.0.1:29800/api/health/ready; echo
          echo "── 深度健康检查 ──"
          curl -fsS http://127.0.0.1:29800/api/health/deep; echo
          echo "── 指标（前 9 行）──"
          curl -fsS http://127.0.0.1:29800/metrics | head -9
          echo "── 安全响应头 ──"
          curl -fsS -o /dev/null -D - http://127.0.0.1:29800/ | grep -iE 'content-security-policy|x-frame-options|x-content-type-options' || true
          pkill -f ControlHub.Server || true

      # 桌面外壳依赖 Windows 专有的服务控制 API，只在 Windows 上编译（其余平台仍会还原，保证依赖可解析）。
      - name: 构建桌面外壳（仅 Windows）
        if: matrix.os == 'windows-latest'
        run: dotnet build src/ControlHub.Shell/ControlHub.Shell.csproj -c Release --no-restore

      - name: 发布 A 端产物（框架依赖）
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/ControlHub.Server/ControlHub.Server.csproj -c Release --no-restore -o dist/server

      - name: 上传 A 端产物
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: controlhub-server
          path: dist/server
          retention-days: 7

  # ── B 端插件：编译期需要 ClassIsland 主程序集，从 ClassIsland 官方 Release 取 ──
  # 说明：ControlHub.Plugin.csproj 通过 ClassIslandAssemblyPath 引用 ClassIsland.dll
  #      （Private=false，不打进插件包）。本地开发指向自己的 ClassIsland 源码构建产物，
  #      CI 上则从官方发行包解出该 dll 后，用 -p: 覆盖该属性。
  plugin:
    name: 构建 B 端插件（.cipx）
    runs-on: ubuntu-latest
    env:
      # 仓库变量 CLASSISLAND_VERSION 可覆盖；未设置时用下面的默认值
      CLASSISLAND_VERSION: ${{ vars.CLASSISLAND_VERSION || '2.1.1.1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载 ClassIsland 发行包并定位主程序集
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/classisland
          cd ci/classisland

          # 官方 Release 的资产名与 tag 前缀可能变化（v2.1.1.1 / 2.1.1.1），这里两种都试。
          # 若将来仍失败，请按实际资产名调整 --pattern（例如 '*.7z'）。
          gh release download "v${CLASSISLAND_VERSION}" --repo ClassIsland/ClassIsland \
            --pattern '*.zip' --dir . \
          || gh release download "${CLASSISLAND_VERSION}" --repo ClassIsland/ClassIsland \
            --pattern '*.zip' --dir .

          for f in *.zip; do unzip -oq "$f" -d expanded; done

          dll="$(find expanded -name 'ClassIsland.dll' | head -n 1)"
          if [ -z "$dll" ]; then
            echo "::error::未在 ClassIsland 发行包中找到 ClassIsland.dll，请检查资产名或 CLASSISLAND_VERSION"
            exit 1
          fi

          echo "CLASSISLAND_ASSEMBLY=$PWD/$dll" >> "$GITHUB_ENV"
          echo "使用 ClassIsland 主程序集：$PWD/$dll"

      - name: 构建插件并打包 .cipx
        run: |
          dotnet build src/ControlHub.Plugin/ControlHub.Plugin.csproj -c Release \
            -p:CreateCipx=true \
            -p:ClassIslandAssemblyPath="$CLASSISLAND_ASSEMBLY"

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: plugin-cipx
          path: src/ControlHub.Plugin/cipx/ControlHub.Plugin.cipx
          retention-days: 7
