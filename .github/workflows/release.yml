name: 发布

# 打标签即发布：标签格式与 manifest.yml 的 tagPattern（1.*.*.*）保持一致，
# 例如 1.1.0.0 —— 插件市场按该标签抓取 ControlHub.Plugin.cipx。
on:
  push:
    tags:
      - '1.*.*.*'
      - 'v1.*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（需已存在，例如 1.1.0.0）
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CLASSISLAND_VERSION: '2.1.1.1'

jobs:
  # ── 桌面外壳：与 A 端一起打成「解压即用」的 Windows 包 ──
  # 外壳是 WinExe 且依赖 Windows 专有的服务控制 API，因此在 Windows 上打包。
  shell:
    name: 打包桌面外壳（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 解析版本号
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: 发布外壳与 A 端到同一目录（框架依赖）
        shell: bash
        run: |
          set -euo pipefail
          # 外壳会在自己的 server/ 子目录里找 A 端，所以直接发布进去即可。
          dotnet publish src/ControlHub.Server/ControlHub.Server.csproj -c Release -r win-x64 --self-contained false -o shell/server
          # 外壳必须指定 RID 发布：不带 RID 时会把 Avalonia/Skia 的**所有平台**原生库一起带上
          # （runtimes/ 目录 300 MB 左右，压缩后仍有 190 MB），指定 win-x64 后约 50 MB。
          dotnet publish src/ControlHub.Shell/ControlHub.Shell.csproj -c Release -r win-x64 --self-contained false -o shell

      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path shell/* -DestinationPath "dist/classislandcontrolhub-shell-win-x64-$env:VERSION.zip"
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传外壳包
        uses: actions/upload-artifact@v4
        with:
          name: shell-bundle
          path: dist/classislandcontrolhub-shell-win-x64-*.zip
          retention-days: 7

  release:
    name: 构建并发布
    needs: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 解析版本号
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # ── A 端：Linux / Windows 各发两种形态 ──
      #   controlhub-server-<平台>-<版本>.zip       框架依赖：小，但目标机需先装 .NET 10 运行时
      #   controlhub-server-<平台>-full-<版本>.zip  自带运行时：大，解压即跑，不依赖目标机环境
      # 两种包功能完全一致、数据目录与配置项相同，可以互换（换包时保留 data/ 即可）。
      - name: 发布 A 端（linux-x64 / win-x64 × 框架依赖 / 自带运行时）
        run: |
          set -euo pipefail
          for rid in linux-x64 win-x64; do
            dotnet publish src/ControlHub.Server/ControlHub.Server.csproj \
              -c Release -r "$rid" --self-contained false -o "dist/server-$rid"
            (cd dist && zip -qr "controlhub-server-$rid-$VERSION.zip" "server-$rid")

            dotnet publish src/ControlHub.Server/ControlHub.Server.csproj \
              -c Release -r "$rid" --self-contained true -o "dist/server-$rid-full"
            (cd dist && zip -qr "controlhub-server-$rid-full-$VERSION.zip" "server-$rid-full")
          done
          ls -lh dist/*.zip

      # ── B 端插件：先取 ClassIsland 主程序集，再打包 .cipx ──
      - name: 下载 ClassIsland 发行包并定位主程序集
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/classisland
          cd ci/classisland
          gh release download "v${CLASSISLAND_VERSION}" --repo ClassIsland/ClassIsland \
            --pattern '*.zip' --dir . \
          || gh release download "${CLASSISLAND_VERSION}" --repo ClassIsland/ClassIsland \
            --pattern '*.zip' --dir .
          for f in *.zip; do unzip -oq "$f" -d expanded; done
          dll="$(find expanded -name 'ClassIsland.dll' | head -n 1)"
          if [ -z "$dll" ]; then
            echo "::error::未在 ClassIsland 发行包中找到 ClassIsland.dll"
            exit 1
          fi
          echo "CLASSISLAND_ASSEMBLY=$PWD/$dll" >> "$GITHUB_ENV"

      - name: 构建插件并打包 .cipx
        run: |
          dotnet build src/ControlHub.Plugin/ControlHub.Plugin.csproj -c Release \
            -p:CreateCipx=true \
            -p:ClassIslandAssemblyPath="$CLASSISLAND_ASSEMBLY"

      - name: 取回桌面外壳包
        uses: actions/download-artifact@v4
        with:
          name: shell-bundle
          path: dist

      - name: 整理发布资产
        run: |
          set -euo pipefail
          cp src/ControlHub.Plugin/cipx/ControlHub.Plugin.cipx dist/
          ls -lh dist/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "ClassislandControlHub $VERSION" \
            --generate-notes \
            "dist/ControlHub.Plugin.cipx" \
            dist/controlhub-server-linux-x64-"$VERSION".zip \
            dist/controlhub-server-linux-x64-full-"$VERSION".zip \
            dist/controlhub-server-win-x64-"$VERSION".zip \
            dist/controlhub-server-win-x64-full-"$VERSION".zip \
            dist/classislandcontrolhub-shell-win-x64-"$VERSION".zip

      # 在自动生成的变更列表后追加「下载哪个包」：两种 A 端包只差「要不要先装 .NET 运行时」，
      # 这件事必须在下载页说清楚，否则用户会下到需要运行时的那种然后启动失败。
      - name: 追加「下载哪个包」说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > notes.md
          cat >> notes.md <<'EOF'

          ---

          ## 下载哪个包？

          | 资产 | 说明 | 适合谁 |
          |---|---|---|
          | `ControlHub.Plugin.cipx` | 教室端插件（与插件市场同款） | 每台教室机 |
          | `controlhub-server-<平台>-<版本>.zip` | A 端，**框架依赖**：体积小，但目标机需先装 **.NET 10 运行时** | 已装 .NET 10，或用 `sh/main.sh` 自动安装的服务器 |
          | `controlhub-server-<平台>-full-<版本>.zip` | A 端，**自带运行时**：体积大，解压即可运行 | 不想在服务器上装运行时的场景（多数学校选它） |
          | `classislandcontrolhub-shell-win-x64-<版本>.zip` | Windows 桌面外壳（内置 A 端，双击即用） | 只有一台 Windows 机器、不想记命令的场景 |

          两种 A 端包的**功能完全一致**，唯一区别是「要不要目标机先装 .NET 10 运行时」：
          前者把运行时留给系统，后者把运行时一起打包。数据目录与配置项完全相同，**可以互换**——
          换包时保留 `data/` 目录即可，无需重新注册设备。
          EOF
          gh release edit "$TAG" --notes-file notes.md
          echo "发布说明已追加「下载哪个包」对照表。"
